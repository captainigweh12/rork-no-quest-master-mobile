name: EAS Build & Update

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Custom Dev Client
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      
      - name: Build iOS development client
        run: eas build --platform ios --profile development --non-interactive
        continue-on-error: true
      
      - name: Build Android development client
        run: eas build --platform android --profile development --non-interactive
        continue-on-error: true

  preview:
    name: Build Preview Builds
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[preview]')
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      
      - name: Build iOS preview
        run: eas build --platform ios --profile preview --non-interactive
        continue-on-error: true
      
      - name: Build Android preview
        run: eas build --platform android --profile preview --non-interactive
        continue-on-error: true

  update:
    name: Publish OTA Update
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[build]') && !contains(github.event.head_commit.message, '[preview]')
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      
      - name: Publish update
        run: eas update --branch main --message "${{ github.event.head_commit.message }}" --non-interactive
