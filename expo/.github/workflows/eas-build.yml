name: EAS Build (disabled)

on:
  # Temporarily disable automatic builds by removing push triggers.
  # Keep manual dispatch available, but jobs below are hard-skipped unconditionally.
  workflow_dispatch:

jobs:
  build-dev-client:
    name: Build Dev Client
    runs-on: ubuntu-latest
    if: ${{ false }} # Disabled for now
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Expo and EAS (disabled)
        if: ${{ false }}
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          # Re-add `token: ${{ secrets.EXPO_TOKEN }}` when re-enabling builds

      - name: Build iOS dev client
        run: eas build --platform ios --profile development --non-interactive
        continue-on-error: true

      - name: Build Android dev client
        run: eas build --platform android --profile development --non-interactive
        continue-on-error: true

  build-preview:
    name: Build Preview
    runs-on: ubuntu-latest
    if: ${{ false }} # Disabled for now
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Expo and EAS (disabled)
        if: ${{ false }}
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          # Re-add `token: ${{ secrets.EXPO_TOKEN }}` when re-enabling builds

      - name: Build iOS preview
        run: eas build --platform ios --profile preview --non-interactive
        continue-on-error: true

      - name: Build Android preview
        run: eas build --platform android --profile preview --non-interactive
        continue-on-error: true

  build-production:
    name: Build Production
    runs-on: ubuntu-latest
    if: ${{ false }} # Disabled for now
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Expo and EAS (disabled)
        if: ${{ false }}
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          # Re-add `token: ${{ secrets.EXPO_TOKEN }}` when re-enabling builds

      - name: Build iOS production (App Store / TestFlight)
        run: eas build --platform ios --profile production --non-interactive
        continue-on-error: true

      - name: Build Android production (Play Store)
        run: eas build --platform android --profile production --non-interactive
        continue-on-error: true

  # OTA updates disabled globally; update job removed. Re-enable by restoring this job and setting OTA_ENABLED / ALWAYS_DISABLE_OTA appropriately.
